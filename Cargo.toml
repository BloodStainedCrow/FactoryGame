[workspace]
resolver = "3"
members = ["frontend", "world", "middle", "middle_indices", "data", "backend", "factory", "tilelib", "entity_info"]

[workspace.lints.rust]
unused_imports = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
enum_glob_use = { level = "deny", priority = -1 }
pedantic = "deny"
nursery = "deny"
unwrap_used = { level = "deny", priority = -1 }
match_same_arms = { level = "deny", priority = -1 }
missing_panics_doc = { level = "allow", priority = 1 }
assert_is_empty = { level = "allow", priority = 1 }
legacy_numeric_constants = "deny"


[profile.release]
# lto = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
lto = false

[profile.release-with-debug-asserts]
inherits = "release-with-debug"
debug-assertions = true
