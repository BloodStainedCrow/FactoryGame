[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = { version = "1.0.1", features = ["serde"], default-features = false }
data = { path = "../data" }
itertools = "0.14.0"
stable-vec = "0.4.3"
static_assertions = "1.1.0"
middle_indices = { path = "../middle_indices" }
serde = { version = "1.0.229", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
proptest = "1.11.0"
data = { path = "../data", features = ["test"] }

[lints]
workspace = true
