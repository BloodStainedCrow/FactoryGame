[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = { version = "1.0.1", features = ["serde"] }
data = { path = "../data" } 
itertools = "0.14.0"
log = "0.4.32"
middle = { path = "../middle" } 
rand = { version = "0.10.1", features = ["thread_rng"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
take_mut = "0.2.2"

[dev-dependencies]
proptest = "1.11.0"
data = { path = "../data", features = ["test"] }

[lints]
workspace = true
